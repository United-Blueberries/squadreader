# sqreader in Docker — see the "Docker" section in the README. Configured
# entirely through variables from `.env` next to this file or the shell.
#
#   docker compose run --rm sqreader doctor
#   docker compose up -d
#
services:
  sqreader:
    pid: host  # needed to see the game container's PID from the host namespace
    cap_drop: [ALL]
    cap_add:
      # SYS_PTRACE: /proc/<pid>/mem open + reads are ptrace-gated.
      # DAC_READ_SEARCH: the game runs as the steam uid and its mem file is
      # 0600, so plain file permissions aren't enough even for root.
      - SYS_PTRACE
      - DAC_READ_SEARCH
    security_opt:
      # Try removing this first: since the game container is also docker-default,
      # the default apparmor profile may already allow ptrace between peers.
      - apparmor:unconfined
    read_only: true
    tmpfs: [/tmp]
    network_mode: host
    restart: always
    stop_grace_period: 30s
    cpuset: "4-7"  # mirrors the systemd drop-in's AllowedCPUs — adjust per box
    build:
      context: .
    command:
      - serve
      - --host=127.0.0.1
      - --port=${SQREADER_PORT:-8081}
      - --hz=0.5
      - --recordings-dir=/data/recordings
      - --stats-db=/data/stats/player_stats.db
      - --icons-dir=/app/icons
      - --sqmaps-dir=/app/sqmaps
      - --frontend-dir=/app/frontend/dist
      - --squad-log=/squad-logs/SquadGame.log
    volumes:
      # Own data dir, fresh — does not reuse the systemd install's. Not ./data:
      # that is the static metadata baked into the image.
      - ./sqreader-data:/data
      # Mount the LOG DIR, not the log file itself: Squad rotates/recreates
      # SquadGame.log on restart, so a single-file bind mount would keep
      # reading the old (now-stale) inode after that happens.
      - ${SQUAD_LOGS:?e.g. /path/to/squad/SquadGame/Saved/Logs}:/squad-logs:ro
    # Every SQREADER_<KEY> in .env reaches the container (see .env.example).
    env_file: .env
    environment:
      # Re-stated only so compose refuses to start without it: on a box with
      # more than one Squad server the reader would otherwise attach to an
      # arbitrary one (see config.find_squad_server_pid).
      SQREADER_SQUAD_PORT: ${SQREADER_SQUAD_PORT:?set SQREADER_SQUAD_PORT in .env to this server's -Port=}
